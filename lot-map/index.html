<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f6f2">
  <title>Property Lots</title>
  <link rel="preconnect" href="https://tile.openstreetmap.org" crossorigin>
  <link rel="dns-prefetch" href="//tile.openstreetmap.org">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell" id="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Property lots">
      <div id="sidebar-list-view" class="sidebar-view">
        <header class="sidebar-header">
          <p class="eyebrow">PROPERTY VIEWER</p>
          <h1>Lots</h1>
          <p class="intro">Tap a parcel on the map or in the list. Its survey details will load here without changing the map zoom or position.</p>
        </header>

        <div class="reference-note">
          <strong>BLLM reference configured</strong>
          <span>10.0575399083, 124.4719672419 · WGS84</span>
        </div>

        <div class="lot-list" id="lot-list"></div>
      </div>

      <section id="sidebar-details-view" class="sidebar-details-view" hidden aria-label="Selected lot details">
        <div class="sidebar-details-nav">
          <button id="sidebar-back" class="sidebar-back" type="button" aria-label="Back to lot list">
            <span aria-hidden="true">←</span> Back to lots
          </button>
        </div>
        <div id="details-content" class="details-content sidebar-details-content"></div>
      </section>
    </aside>

    <main class="map-panel" id="map-panel">
      <div class="map-toolbar" aria-label="Map toolbar">
        <label class="layer-control">
          <span>Map</span>
          <select id="osm-layer" aria-label="Map background">
            <option value="standard">Street</option>
            <option value="satellite">Satellite</option>
          </select>
        </label>

        <button id="show-all" type="button">All 8 lots</button>
        <button id="fullscreen" type="button">Fullscreen</button>
      </div>

      <div id="osm-map" class="map map-osm" tabindex="0" aria-label="Interactive property lot map">
        <div id="tile-layer" class="tile-layer" aria-hidden="true"></div>
        <svg id="vector-layer" class="vector-layer" aria-label="Property lot polygons"></svg>
        <div id="map-attribution" class="map-attribution">
          &copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors
        </div>
      </div>

      <div class="zoom-controls" aria-label="Zoom controls">
        <button id="zoom-in" type="button" aria-label="Zoom in">+</button>
        <button id="zoom-out" type="button" aria-label="Zoom out">−</button>
      </div>

      <div id="map-status" class="map-status" role="status" aria-live="polite">Loading map…</div>

    </main>
  </div>

  <script src="config.js"></script>
  <script src="lots.js"></script>
  <script src="app.js"></script>
</body>
</html>
